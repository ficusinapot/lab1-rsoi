services:
  postgres:
    image: postgres:18-alpine
    container_name: rsoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: persons
      POSTGRES_USER: program
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U program -d persons"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-18-data:/var/lib/postgresql

volumes:
  postgres-data:
  postgres-18-data:
