  e2e-newman-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        run: |
          newman run \
            "postman/[inst] Lab1.postman_collection.json" \
            -e "postman/[inst][render] Lab1.postman_environment.json" \
            --delay-request 100 \
            --reporters cli